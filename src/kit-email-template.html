<!-- Rebellion Collective email template, 2026 brand.
     Kit: Settings -> Email -> Email templates -> New template -> HTML editor.
     Paste everything below this comment. {{ content }} is where each email's body renders. -->
<table width="100%" cellpadding="0" cellspacing="0" bgcolor="#F7F3E8" style="background-color:#F7F3E8;margin:0;padding:0">
  <tr>
    <td align="center" style="padding:32px 16px">
      <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%">
        <tbody>
          <tr>
            <td bgcolor="#064B56" style="background-color:#064B56;border-radius:10px 10px 0 0;padding:20px 28px">
              <span style="font-family:'DM Mono','Courier New',monospace;font-size:12px;letter-spacing:2px;color:#DBE0B2;text-transform:uppercase">Rebellion Collective</span>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 0 0 0">
              <table cellpadding="0" cellspacing="0"><tr><td width="48" height="4" bgcolor="#F2542D" style="font-size:0;line-height:0">&nbsp;</td></tr></table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 4px;font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.65;color:#1E2422">
              {{ message_content }}
            </td>
          </tr>
          <tr>
            <td style="border-top:2px solid #DBE0B2;padding:20px 4px 0 4px;font-family:'DM Mono','Courier New',monospace;font-size:11px;letter-spacing:1.5px;color:#4C554C;text-transform:uppercase">
              Rebellion Collective &middot; <a href="https://rebellioncollective.com" style="color:#064B56">rebellioncollective.com</a>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 4px 0 4px;font-family:Poppins,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.6;color:#4C554C">
              {{ address }}<br/>
              <a href="{{ unsubscribe_url }}" style="color:#064B56">Unsubscribe</a> &middot; <a href="{{ subscriber_preferences_url }}" style="color:#064B56">Preferences</a>
            </td>
          </tr>
        </tbody>
      </table>
    </td>
  </tr>
</table>
