<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  @page { size: 1200px 630px; margin: 0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#064B56; font-family:'Poppins',sans-serif; overflow:hidden; }
  .wrap { padding:76px 84px; height:100%; display:flex; flex-direction:column; justify-content:center; position:relative; }
  .kicker { font-family:'DM Mono',monospace; font-size:22px; letter-spacing:.2em; text-transform:uppercase; color:#DBE0B2; }
  h1 { color:#F7F3E8; font-weight:700; font-size:132px; line-height:1; margin:18px 0 0; letter-spacing:-.02em; }
  .rule { width:120px; height:8px; background:#F2542D; margin:34px 0 30px; }
  .tag { color:#DBE0B2; font-weight:300; font-size:38px; line-height:1.3; max-width:22ch; }
  .foot { position:absolute; left:84px; bottom:62px; font-family:'DM Mono',monospace; font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:#8fa3a0; }
  .bars { position:absolute; right:84px; bottom:62px; display:flex; flex-direction:column; gap:12px; align-items:flex-end; }
  .bars i { display:block; height:10px; border-radius:5px; }
  .b1 { width:150px; background:#DBE0B2; } .b2 { width:110px; background:#DBE0B2; } .b3 { width:70px; background:#F2542D; }
</style></head><body><div class="wrap">
  <span class="kicker">Rebellion Manual &middot; Core Beliefs</span>
  <h1>Bedrock</h1>
  <div class="rule"></div>
  <p class="tag">The beliefs you never question are the ones running your life.</p>
  <span class="foot">manuals.rebellioncollective.com</span>
  <span class="bars"><i class="b1"></i><i class="b2"></i><i class="b3"></i></span>
</div></body></html>
